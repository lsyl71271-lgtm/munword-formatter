name: Publish accepted desktop installers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-desktop-release.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: release-v1.8.5-desktop.1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Require the exact successful native acceptance run
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const run_id = 37464684956;
            const {data: run} = await github.rest.actions.getWorkflowRun({...repo, run_id});
            if (run.conclusion !== 'success' || run.head_sha !== '8f7a3a98319e35a1c8534ae991d455a46f9431de') {
              throw new Error('The accepted build must match the successful source commit');
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {...repo, run_id});
            if (jobs.length !== 6 || jobs.some(job => job.conclusion !== 'success')) {
              throw new Error('All source, native installer and Windows 11 ARM jobs must pass');
            }
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37464684956
          pattern: Munword-*
          path: work/release-artifacts
      - name: Check native acceptance and the exact installer SHA-256 values
        run: python3 scripts/prepare-desktop-release.py --artifacts work/release-artifacts --output work/release-assets
      - name: Upload all assets before making the release public
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const repo = context.repo;
            const tag = 'v1.8.5-desktop.1';
            const source = '8f7a3a98319e35a1c8534ae991d455a46f9431de';
            const body = [
              '## Mac 启动修复',
              '此修订版修复了点击“仍要打开”后内置 Python 库因签名 Team ID / Library Validation 错误而无法加载的问题。请重新下载 DMG，将应用拖入 Applications 并替换旧版。已增加所有原生文件的签名策略校验和 LaunchServices 启动验收。',
              '',
              '## 下载与安装',
              'Apple 芯片 Mac（M 系列）下载 macOS-arm64.dmg；Intel Mac 下载 macOS-x64.dmg。打开 DMG，将 Munword 拖入 Applications 后启动。',
              '常见 64 位 Windows 电脑下载 Windows-x64-Setup.exe；32 位 Windows 10 下载 Windows-x86-Setup.exe。双击安装，从桌面或开始菜单启动。',
              '',
              '排版、识别、编辑、DOCX 导出与预览均为纯本地运行，全部组件随包提供，无需安装 Python、Node 或下载运行组件。界面使用系统浏览器。',
              '',
              '## 验收与限制',
              '444 项源码测试及四个安装包的原生安装、七份文稿上传/识别/导出/预览/模板流程通过。Windows x64、x86 完成运行中升级和卸载，同一 x64 EXE 也通过 Windows 11 ARM 仿真验收。',
              '目标 macOS 11+、Windows 10/11；需 Edge/Chrome 111+、Firefox 128+ 或 Safari 16.4+。未覆盖每种旧系统和硬件。',
              'macOS 包已校验容器、临时签名及全部 45 个原生文件的最低版本，但没有 Apple Developer ID 公证；Windows 包没有 Authenticode 签名，系统仍可能显示开发者/SmartScreen 提示。',
              '',
              'SHA256SUMS.txt 用于核对安装包；Verification.zip 包含原生验收记录、截图、最低版本清单及安装说明。',
              '[完整验收工作流](https://github.com/lsyl71271-lgtm/munword-formatter/actions/runs/37464684956)',
              '源代码提交：`' + source + '`'
            ].join('\n');
            let ref;
            try {
              ref = (await github.rest.git.getRef({...repo, ref: 'tags/' + tag})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              ref = (await github.rest.git.createRef({...repo, ref: 'refs/tags/' + tag, sha: source})).data;
            }
            if (ref.object.type !== 'commit' || ref.object.sha !== source) throw new Error('Release tag points to unexpected code');
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({...repo, tag})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({...repo, tag_name: tag,
                target_commitish: source, name: 'v1.8.5 desktop.1 · 修复 Mac 无法启动', body,
                draft: true, prerelease: false})).data;
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {...repo, release_id: release.id});
            const folder = 'work/release-assets';
            const files = fs.readdirSync(folder).sort();
            if (files.length !== 6) throw new Error('Expected six verified release assets');
            for (const name of files) {
              const data = fs.readFileSync(path.join(folder, name));
              const digest = 'sha256:' + crypto.createHash('sha256').update(data).digest('hex');
              const existing = assets.find(asset => asset.name === name);
              if (existing) {
                if (existing.size !== data.length || existing.digest !== digest || existing.state !== 'uploaded') {
                  throw new Error('Existing asset differs; will not overwrite: ' + name);
                }
                continue;
              }
              if (!release.draft) throw new Error('Will not modify an incomplete public release');
              const {data: uploaded} = await github.rest.repos.uploadReleaseAsset({...repo,
                release_id: release.id, name, data,
                headers: {'content-type': 'application/octet-stream', 'content-length': data.length}});
              if (uploaded.digest !== digest || uploaded.size !== data.length) throw new Error('Upload integrity failed: ' + name);
              core.info('Uploaded and verified ' + name);
            }
            if (release.draft) release = (await github.rest.repos.updateRelease({...repo,
              release_id: release.id, draft: false, prerelease: false, make_latest: 'true'})).data;
            core.info('Published ' + release.html_url);
            const old = (await github.rest.repos.getReleaseByTag({...repo, tag: 'v1.8.5-desktop'})).data;
            const warning = '**Mac 启动问题已修复：旧版 DMG 存在内置 Python 签名配置错误，请使用 [修订版 desktop.1](https://github.com/lsyl71271-lgtm/munword-formatter/releases/tag/v1.8.5-desktop.1)。**';
            if (!old.body.includes(warning)) await github.rest.repos.updateRelease({...repo, release_id: old.id, body: warning + '\n\n' + old.body});
