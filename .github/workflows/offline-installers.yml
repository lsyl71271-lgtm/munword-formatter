name: PKUNMUN offline installers (DMG / EXE / APK)

# Checks the published downloads/PKUNMUN2026-Formatter-macOS.dmg, -Windows-Setup.exe and -Android.apk:
# - rebuilt from source on Linux, the DMG and EXE must match downloads/SHA256SUMS.txt byte for byte, and the APK
#   must have exactly the published APK's contents, signed by the pinned key;
# - the offline page passes all acceptance inputs in Chromium and the oldest supported Chromium;
# - the EXE installs, launches, upgrades and uninstalls on Windows 7 32-bit / Windows 10 (Wine),
#   Windows Server 2022 x64 and Windows 11 ARM, with the full flow in the installed Edge, Chrome, Firefox;
# - the DMG verifies, its app passes Apple's codesign and runs natively on Apple silicon and Intel
#   (macOS 14 and 15), with the full flow in the installed Safari, Chrome, Firefox; Safari also opens the
#   app and the single-file page the way users do (LaunchServices), read back through Accessibility;
# - the Android page passes all inputs in Chromium 69 to current (67 gets the update notice), and the APK runs on
#   Android 5.0 to 15 emulators with each system's own WebView: saving to Download, the storage prompt, open with /
#   share, and every input through the full flow wherever the WebView is new enough (the notice elsewhere).
# Only when all of that passes, pushes to main or the desktop branch publish the installers on the
# GitHub Releases page (tag v<VERSION>-desktop.2).

on:
  push:
    paths:
      - 'desktop/**'
      - 'android/**'
      - 'tests/desktop.test.mjs'
      - 'tests/android.test.mjs'
      - 'downloads/**'
      - 'VERSION'
      - '.github/workflows/offline-installers.yml'
      # Everything the bundled page is built from: a change here must come with rebuilt installers
      # (pnpm build:desktop), or the reproduce job fails.
      - 'app/**'
      - 'local_web/**'
      - 'shared/**'
      - 'public/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'postcss.config.mjs'
      - 'scripts/build-local-tools.mjs'
      - 'scripts/build-static.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    name: Rebuild from source and compare (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the build time stamp is the commit that set VERSION
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - name: Build tools (NSIS, hfsprogs, libfaketime, zsh)
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis hfsprogs faketime zsh cmake libbz2-dev zlib1g-dev liblzma-dev libssl-dev
      - name: libdmg-hfsplus with the repository's patch
        run: |
          git clone https://github.com/mozilla/libdmg-hfsplus "$RUNNER_TEMP/libdmg"
          cd "$RUNNER_TEMP/libdmg"
          git checkout ec239599c1f234a4e01ae3fe51214d0c77e5baa3
          git apply "$GITHUB_WORKSPACE/desktop/macos/libdmg-hfsplus.patch"
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
      - uses: actions/cache@v4
        with:
          path: ~/.local/rcodesign
          key: rcodesign-0.29.0-${{ runner.os }}
      - name: rcodesign (apple-codesign 0.29.0)
        run: test -x ~/.local/rcodesign/bin/rcodesign || cargo install apple-codesign --version 0.29.0 --locked --root ~/.local/rcodesign
      - run: pnpm install --frozen-lockfile
      - name: Desktop unit tests (bash and zsh)
        run: MUNWORD_TEST_SHELLS=/bin/bash:/usr/bin/zsh node --test tests/desktop.test.mjs
      - name: Rebuild both installers
        env:
          HFSPLUS_TOOL: ${{ runner.temp }}/libdmg/build/hfs/hfsplus
          DMG_TOOL: ${{ runner.temp }}/libdmg/build/dmg/dmg
        run: RCODESIGN="$HOME/.local/rcodesign/bin/rcodesign" node desktop/build-desktop.mjs
      - name: Published installers are exactly what the source builds
        run: |
          cd dist/desktop
          grep -E '  PKUNMUN2026-Formatter-(macOS\.dmg|Windows-Setup\.exe)$' ../../downloads/SHA256SUMS.txt | sha256sum --check
      - name: Playwright with its Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright@1.56.1
          node "$RUNNER_TEMP/pw/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Offline page, all inputs, from file://
        env:
          MUNWORD_PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright/index.mjs
        run: node desktop/offline-smoke.mjs
      - name: Oldest supported Chromium (98 refused, 99 and 109 complete)
        env:
          MUNWORD_PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright/index.mjs
        run: node desktop/acceptance/browser-floor.mjs dist/desktop/site "$RUNNER_TEMP/old-chromium"
      - if: always()
        run: mkdir -p output/acceptance && cp "$RUNNER_TEMP"/old-chromium/*.json "$RUNNER_TEMP"/old-chromium/*.png output/acceptance/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-rebuild-and-page
          path: |
            dist/desktop/*.dmg
            dist/desktop/*.exe
            output/desktop-smoke/
            output/acceptance/
          retention-days: 30

  wine:
    name: Windows 7 32-bit and Windows 10 in Wine
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Wine (32- and 64-bit), NSIS, Xvfb
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 wine32:i386 nsis xvfb
      - name: Scenarios (browser choice, install paths, uninstall)
        run: |
          bash desktop/acceptance/wine/scenarios.sh "$RUNNER_TEMP/wine" win7 | tee win7.txt
          bash desktop/acceptance/wine/scenarios.sh "$RUNNER_TEMP/wine" win10 | tee win10.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wine-scenarios
          path: win*.txt
          retention-days: 30

  windows:
    name: Native ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the 1.8.4 installer for the upgrade test comes from history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install selenium==4.50.0
      - name: Install, launch, full flow in Edge / Chrome / Firefox, upgrade, uninstall
        env:
          PYTHONUTF8: '1'
        run: python desktop/acceptance/windows.py --out output/acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ matrix.os }}
          path: output/acceptance/
          retention-days: 30

  macos:
    name: Native ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install selenium==4.50.0 pyobjc-framework-ApplicationServices==12.2.2
      - name: Allow WebDriver in Safari; browsers as a user has them
        run: |
          # Homebrew installed the image's Chrome and Firefox with the download quarantine, so their first
          # LaunchServices start waits on "downloaded from the Internet"; a user's browser was approved long ago.
          for app in "/Applications/Google Chrome.app" "/Applications/Firefox.app" "/Applications/Microsoft Edge.app"; do
            [ -d "$app" ] && sudo xattr -dr com.apple.quarantine "$app" || true
          done
          sudo safaridriver --enable
          defaults write com.apple.Safari AllowRemoteAutomation 1 || true
          defaults write com.apple.Safari IncludeDevelopMenu 1 || true
      - name: Verify, codesign, Gatekeeper verdict, native launch, full flow in Safari / Chrome / Firefox
        env:
          PYTHONUTF8: '1'
        run: python desktop/acceptance/macos.py --out output/acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ matrix.os }}
          path: output/acceptance/
          retention-days: 30

  android:
    name: Android APK — rebuild and compare; the page in Chromium 67 to current
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - name: Android build tools from Ubuntu (aapt2, dx, zipalign, apksigner, android.jar) and OpenJDK 21
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt dalvik-exchange zipalign apksigner libandroid-23-java openjdk-21-jdk-headless
      - run: pnpm install --frozen-lockfile
      - name: Website build and the desktop page (the reference for the outputs)
        run: node desktop/build-desktop.mjs --only site
      - name: Rebuild the APK; the published one has these exact contents, the pinned signature and manifest
        env:
          JAVAC: /usr/lib/jvm/java-21-openjdk-amd64/bin/javac
        run: node android/acceptance/verify-apk.mjs output/android
      - name: Playwright with its Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright@1.56.1
          node "$RUNNER_TEMP/pw/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Reference outputs (the shared page in current Chromium, all inputs)
        env:
          MUNWORD_PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright/index.mjs
        run: node desktop/offline-smoke.mjs
      - name: Android page in Chromium 67 (update notice) and 69, 79, 83, 88, 95, 99, 109 and current (all inputs)
        run: |
          export MUNWORD_CHROMIUM_EXECUTABLE="$(node --input-type=module -e "const p = await import('$RUNNER_TEMP/pw/node_modules/playwright/index.mjs'); console.log((p.chromium || p.default.chromium).executablePath())")"
          node android/acceptance/webview-floor.mjs dist/android/site output/desktop-smoke output/android/webview-floor
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build
          path: |
            dist/android/*.apk
            output/android/
            !output/android/webview-floor/chromium/
            output/desktop-smoke/*.docx
          retention-days: 30

  android-devices:
    name: Android ${{ matrix.release }} (API ${{ matrix.api }}) emulator
    needs: android
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 21, release: '5.0' }
          - { api: 23, release: '6.0' }
          - { api: 26, release: '8.0' }
          - { api: 28, release: '9' }
          - { api: 29, release: '10' }
          - { api: 30, release: '11' }
          - { api: 31, release: '12' }
          - { api: 33, release: '13' }
          - { api: 34, release: '14' }
          - { api: 35, release: '15' }
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: android-build
          path: ${{ runner.temp }}/android-build
      - name: Hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: The published APK with the system's own WebView (no updates installed)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: node android/acceptance/emulator.mjs downloads/PKUNMUN2026-Formatter-Android.apk "${{ runner.temp }}/android-build/output/desktop-smoke" output/android-api${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-api${{ matrix.api }}
          path: |
            output/android-api${{ matrix.api }}/*.json
            output/android-api${{ matrix.api }}/*.png
            output/android-api${{ matrix.api }}/*.txt
          retention-days: 30

  release:
    name: Publish on GitHub Releases
    needs: [reproduce, wine, windows, macos, android, android-devices]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/munword-formatter-audit-e11sma'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: offline-installers-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/artifacts
      - name: Stage installers, checksums, evidence and notes (refuses unless everything passed)
        run: >
          python3 desktop/acceptance/stage_release.py --artifacts "$RUNNER_TEMP/artifacts" --out "$RUNNER_TEMP/release"
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --commit "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}   # runs outside the checkout, so gh cannot read the repository from git
        run: |
          version=$(cat VERSION)
          tag="v${version}-desktop.2"
          title="v${version} · 离线安装包（macOS DMG、Windows EXE、Android APK；兼容 macOS 10.11、Windows 7、Android 5.0 起）"
          cd "$RUNNER_TEMP/release"
          assets=(PKUNMUN2026-Formatter-macOS.dmg PKUNMUN2026-Formatter-Windows-Setup.exe PKUNMUN2026-Formatter-Android.apk "PKUNMUN2026-Install-Guide.txt#安装教程（先看这个）.txt" SHA256SUMS.txt PKUNMUN2026-*-Verification.zip)
          if gh release view "$tag" >/dev/null 2>&1; then
            # Same version, rebuilt installers: move the tag to the verified commit by recreating the release.
            gh release download "$tag" --pattern SHA256SUMS.txt --dir previous
            if cmp -s previous/SHA256SUMS.txt SHA256SUMS.txt; then
              gh release upload "$tag" "${assets[@]}" --clobber
              gh release edit "$tag" --title "$title" --notes-file notes.md --latest
              exit 0
            fi
            gh release delete "$tag" --yes --cleanup-tag
          fi
          gh release create "$tag" "${assets[@]}" --target "$GITHUB_SHA" --title "$title" --notes-file notes.md --latest
