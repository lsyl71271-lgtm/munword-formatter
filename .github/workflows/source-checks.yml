name: Source checks

# Every push and pull request: the program's own tests and builds (both engines, the website bundle, the
# static deployment, typing, lint and the source audit). The installers are checked separately by
# offline-installers.yml, which also runs whenever the bundled page changes.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests, builds, typing, lint, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r backend/requirements.txt
      - run: cp .openai/hosting.example.json .openai/hosting.json
      - name: Website bundle and static deployment (also builds the shared offline assets)
        run: pnpm build:static
      - run: pnpm test:unit
      # Not part of test:unit: package.json is recorded in the desktop installers' build record, so changing that
      # script would change the published DMG and EXE.
      - name: Android app (page variant, manifest, published APK)
        run: node --test tests/android.test.mjs
      - name: Python engine, API and CLI
        run: python -m unittest discover -s backend/tests
      - run: pnpm build
      - run: node --test tests/rendered-html.test.mjs
      - run: pnpm test:static
      - run: pnpm typecheck
      - run: pnpm lint
      - run: python scripts/audit-source.py
