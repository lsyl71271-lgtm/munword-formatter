name: Offline desktop installers

on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-installers.yml'
      - 'app/**'
      - 'local_web/**'
      - 'shared/**'
      - 'scripts/build-local-tools.mjs'
      - 'scripts/verify-local-build.py'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s desktop -p 'test_launcher.py' -v
      - run: pnpm test:unit
      - run: python -m unittest discover -s backend/tests -v
      - run: pnpm typecheck
      - run: pnpm lint
      - run: python scripts/audit-source.py

  native-installers:
    needs: source-checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: x64
            python-arch: x64
            browser: chromium
          - runner: windows-2022
            arch: x86
            python-arch: x86
            browser: chromium
          - runner: macos-14
            arch: arm64
            python-arch: arm64
            browser: webkit
          - runner: macos-15-intel
            arch: x64
            python-arch: x64
            browser: webkit
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python-arch }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:local-tools
      - run: python -m pip install -r desktop/requirements-build.txt
      - run: python -m unittest discover -s desktop -p 'test_launcher.py' -v
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        run: choco install nsis --no-progress -y
      - name: Build native offline installer
        run: python desktop/build.py --arch ${{ matrix.arch }}
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
      - name: Install isolated browser test tools
        run: |
          npm install --prefix work/browser --no-audit --no-fund playwright@1.56.1
          node work/browser/node_modules/playwright/cli.js install ${{ matrix.browser }}
      - name: Install, run full offline UI, reinstall and uninstall
        run: |
          artifact=$(find dist/desktop -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' \) | head -1)
          module=$(node -e 'console.log(require("node:path").resolve("work/browser/node_modules/playwright/index.mjs"))')
          python desktop/test_install.py --installer "$artifact" --browser-module "$module" --browser ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Munword-${{ matrix.runner }}-${{ matrix.arch }}
          path: |
            dist/desktop/
            output/desktop-browser/
          if-no-files-found: error
          retention-days: 30
