name: Safari probe (temporary)

on:
  push:
    paths:
      - '.github/safari-probe/**'
      - '.github/workflows/safari-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyobjc-framework-ApplicationServices
      - name: Probe
        run: python -u .github/safari-probe/probe.py
