# Optional GitHub Actions workflow. Activate only with workflow-write authorization.
name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r backend/requirements.txt
      - run: cp .openai/hosting.example.json .openai/hosting.json
      - run: pnpm build:local-tools
      - run: pnpm test:unit
      - run: python -m unittest discover -s backend/tests -v
      - run: pnpm build
      - run: node --test tests/rendered-html.test.mjs
      - run: pnpm typecheck
      - run: pnpm lint
      - run: python scripts/audit-source.py
